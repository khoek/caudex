[workspace]
resolver = "3"
members = [
    "calculo",
    "capulus",
    "clikeys",
    "clikeys-derive",
    "syntheon",
]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/khoek/caudex"

[profile.release-debug]
inherits = "release"
debug = true

[profile.release-lto]
inherits = "release"
codegen-units = 1
lto = "fat"
debug = false
panic = "abort"

[profile.release-lto-debug]
inherits = "release"
codegen-units = 1
lto = "fat"
debug = true

[patch.crates-io]
console = { git = "https://github.com/console-rs/console.git", tag = "0.16.5" }
